# Build the `eos` binary for every platform a developer might be on, and attach it to a
# release when one is tagged.
#
# Two triggers, deliberately different:
#
#   push / pull_request  → build and smoke-test. Proves the three platforms still compile and
#                          run. Artifacts expire; nothing is published.
#   tag `v*`             → the same build, attached to a GitHub Release with checksums.
#
# A binary is not cross-compiled: each one is built on the operating system it targets.

name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Documentation must not rebuild four binaries. Every docs commit was queueing a full
    # matrix, and they stacked behind each other for hours.
    paths:
      - "eos_cli/**"
      - "eos.spec"
      - "eos_launcher.py"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "eos_cli/**"
      - "eos.spec"
      - "eos_launcher.py"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Supersede an in-flight build when a newer commit lands — but never a tag. Cancelling a
# release halfway would leave a tag with no binaries behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false          # one platform failing must not hide the others' results
      matrix:
        include:
          - os: ubuntu-latest
            asset: eos-linux-x64
          - os: macos-latest          # Apple silicon
            asset: eos-macos-arm64
          # No Intel Mac build. `macos-13` was tried and its jobs queue indefinitely — the
          # label no longer allocates a runner. A matrix entry that never starts is worse than
          # an absent platform, because `release` needs `build` and would wait forever. Intel
          # Macs are documented as build-from-source until a working label is confirmed.
          - os: windows-latest
            asset: eos-windows-x64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The CLI's own dependencies and nothing else. If this ever needs more, the packaging
      # boundary has been broken and the build should be what notices.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      # The property that makes the CLI shippable at all: one third-party dependency, and no
      # import of anything that would drag a web framework into a command-line tool. Checked
      # before the slow part.
      - name: Check the import graph
        shell: bash
        run: |
          python - <<'PY'
          import sys
          for name in ("pydantic", "fastapi", "sqlalchemy", "alembic", "starlette"):
              sys.modules[name] = None      # any import of these now fails loudly
          import eos_cli.cli                # noqa: F401
          print("import graph is clean")
          PY

      - name: Build
        run: pyinstaller --clean --noconfirm eos.spec

      # A binary that cannot run is not a build success. `--help` exercises argument parsing
      # and, through it, that every module imported inside the bundle.
      - name: Smoke test
        shell: bash
        run: |
          BIN=dist/eos
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" --help
          "$BIN" connect --help
          "$BIN" publish --help

      # Checksummed with Python rather than `shasum`, which is not on the Windows runner's
      # PATH — and `if`, not `[ ... ] && ...`, because these steps run under `set -e` and a
      # trailing false test fails the step rather than skipping the assignment.
      - name: Name and checksum
        shell: bash
        run: |
          cd dist
          if [ -f eos.exe ]; then mv eos.exe "${{ matrix.asset }}"; else mv eos "${{ matrix.asset }}"; fi
          python -c "import hashlib,sys;p=sys.argv[1];print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p)" "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  release:
    # Only on a tag. A push to main builds and proves; it does not publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write           # narrowest scope that can create a release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -l release
          cat release/*.sha256 > release/SHA256SUMS
          cat release/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Download one file and run it. No runtime, no package manager, nothing else
            installed on your machine.

            ### Which file?

            | Your machine | Download |
            |---|---|
            | **Windows** | `eos-windows-x64.exe` |
            | **Mac** — Apple silicon (M1–M4) | `eos-macos-arm64` |
            | **Linux** — x64 | `eos-linux-x64` |

            Not sure which Mac? Apple menu -> About This Mac, or run `uname -m` — `arm64` is
            Apple silicon. **Intel Macs are not built yet** and cannot run the arm64 binary
            (Rosetta translates Intel to Apple silicon, not the reverse). Build from source, or
            open an issue — knowing someone needs it is what would prioritise it.

            ### Install

            **macOS** — the `xattr` line is required after a browser download; macOS refuses to
            run anything a browser saved unless it is signed, and this binary is not.

            ```sh
            chmod +x ~/Downloads/eos-macos-arm64
            xattr -d com.apple.quarantine ~/Downloads/eos-macos-arm64
            sudo mv ~/Downloads/eos-macos-arm64 /usr/local/bin/eos
            ```

            **Linux**

            ```sh
            chmod +x ~/Downloads/eos-linux-x64
            sudo mv ~/Downloads/eos-linux-x64 /usr/local/bin/eos
            ```

            **Windows** — rename to `eos.exe` and put it in a folder on your `PATH`. The
            [README](https://github.com/MotivatedNaveen/eos-cli#installing) has a PowerShell
            snippet that does both.

            ### Verify it

            ```sh
            shasum -a 256 -c SHA256SUMS --ignore-missing
            eos --help
            ```

            ### Then connect a repository

            Create a project in EOS, download its connection file, and from **inside** the
            repository you want to connect:

            ```sh
            cd /path/to/your/repository
            eos connect
            ```

            It publishes on every commit after that. Nothing else to run.

            [Getting started](https://github.com/MotivatedNaveen/eos-cli/blob/main/docs/getting-started.md)
            · [What gets published](https://github.com/MotivatedNaveen/eos-cli#what-gets-published-and-what-does-not)
            · [AI assistants](https://github.com/MotivatedNaveen/eos-cli/blob/main/docs/ai-adapters.md)
